name: CI and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm run build

      - name: Smoke test backend
        run: |
          npm start &
          SERVER_PID=$!
          sleep 5
          curl --fail http://localhost:3001/api/state || (echo "Backend failed" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: site/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -- --base="/blockchain/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')